<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<title>回測實驗室｜台股學習站</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e4e2db; --soft: #efeee8; --grid: #ecebe5;
    --up: #d1342c; --down: #1a8a4a; --warn: #c27c0e; --accent: #2f6fd6; --ma5: #e08a1e; --ma60: #8a4fc7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9c9a92; --line: #2e2d2a; --soft: #2a2926; --grid: #2a2926;
      --up: #f0574e; --down: #3cbf72; --warn: #e8a53a; --accent: #5b92ec; --ma5: #f0a34a; --ma60: #b07fe6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5;
         font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 12px 16px 60px; }
  .back { color: var(--muted); text-decoration: none; font-size: 15px; display: inline-block; padding: 6px 0; }
  h1 { font-size: 22px; margin: 4px 0 0; }
  .meta { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
  .up { color: var(--up); } .down { color: var(--down); }

  .step { display: flex; align-items: center; gap: 8px; margin: 22px 2px 10px; }
  .step .num { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--bg);
               display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .step b { font-size: 17px; }
  .step small { margin-left: auto; color: var(--muted); font-size: 12px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 2px 0; }

  .modes { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
  .modes button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 8px 0; border-radius: 7px; cursor: pointer; font-size: 14px; }
  .modes button.on { background: var(--ink); color: var(--bg); font-weight: 600; }

  .search { position: relative; }
  .search input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 11px 12px; font-size: 16px; }
  .sugg { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; margin-top: 4px; max-height: 260px; overflow-y: auto; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  .sugg button { display: flex; justify-content: space-between; width: 100%; border: 0; border-top: 1px solid var(--line);
                 background: transparent; padding: 10px 12px; cursor: pointer; text-align: left; }
  .sugg button:first-child { border-top: 0; }
  .sugg small { color: var(--muted); }
  .picked { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; font-size: 15px; }
  .picked b { font-size: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; font-size: 15px; min-height: 60px; }

  .tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tcard { position: relative; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .tcard b { display: block; font-size: 15px; } .tcard span { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 3px; }
  .tcard.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); } .tcard.on b { color: var(--accent); }
  .tcard .x { position: absolute; top: 6px; right: 8px; color: var(--muted); font-size: 16px; padding: 0 4px; }
  .today { border-radius: 12px; padding: 12px 14px; margin-top: 18px; border: 1px solid var(--line); background: var(--panel); font-size: 15px; }
  .today.buy { border-color: var(--up); background: color-mix(in srgb, var(--up) 8%, var(--panel)); }
  .today.sell { border-color: var(--down); background: color-mix(in srgb, var(--down) 8%, var(--panel)); }
  .today .t { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .today b { font-size: 17px; }
  .cmp tr { cursor: pointer; } .cmp tr.on td { background: var(--soft); font-weight: 700; } .cmp tr:hover td { background: var(--soft); }
  .rng { display: flex; gap: 4px; margin: 6px 0; }
  .rng button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .rng button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .trades tr[data-t] { cursor: pointer; } .trades tr.sel td { background: var(--soft); }
  .why { color: var(--muted); font-size: 11px; display: block; white-space: normal; line-height: 1.3; }
  .trades td { white-space: normal; vertical-align: top; } .trades td:nth-child(3), .trades td:nth-child(4) { white-space: nowrap; }
  .tpl { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tpl::-webkit-scrollbar { display: none; }
  .tpl .chip { flex: none; white-space: nowrap; }
  .tpl-desc { color: var(--muted); font-size: 13px; margin: 8px 2px 0; min-height: 1em; }

  .rules h3 { font-size: 15px; margin: 4px 0 2px; display: flex; align-items: center; gap: 8px; }
  .rules h3 .tag { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; }
  .tag.buy { background: var(--up); color: #fff; } .tag.sell { background: var(--down); color: #fff; }
  .rules h3 select { margin-left: auto; font-size: 13px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 6px; font-weight: 400; }
  .rule { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .rule:first-of-type { border-top: 0; }
  .rule .name { font-weight: 600; font-size: 15px; align-self: center; }
  .rule .del { border: 0; background: var(--soft); color: var(--muted); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
  .rule .params { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 14px; color: var(--muted); }
  .rule .params input { width: 66px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 6px; font-size: 15px; color: var(--ink); }
  .rule .desc { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 12px 0; }
  .add { width: 100%; margin-top: 6px; border: 1px dashed var(--accent); color: var(--accent); background: var(--panel);
         border-radius: 10px; padding: 9px; cursor: pointer; font-weight: 600; }
  .divider { height: 1px; background: var(--line); margin: 14px 0; }

  .settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .settings label { font-size: 13px; color: var(--muted); display: block; }
  .settings input, .settings select { width: 100%; margin-top: 3px; border: 1px solid var(--line); background: var(--bg);
                                       border-radius: 8px; padding: 8px; font-size: 15px; color: var(--ink); }

  .run { display: block; width: 100%; margin: 18px 0 0; border: 0; background: var(--accent); color: #fff; font-weight: 700;
         font-size: 17px; border-radius: 12px; padding: 14px; cursor: pointer; }
  .run:disabled { opacity: .5; }
  .save { display: block; width: 100%; margin-top: 8px; border: 1px solid var(--line); background: var(--panel);
          border-radius: 10px; padding: 10px; cursor: pointer; color: var(--muted); }

  #results { scroll-margin-top: 12px; }
  .verdict { border-radius: 12px; padding: 14px; margin-top: 18px; border: 1px solid var(--line); background: var(--panel); font-size: 15px; }
  .verdict b { font-size: 17px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .val { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 11px; color: var(--muted); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
  section h2 { font-size: 16px; margin: 0 0 4px; }
  .lg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin: 4px 0; }
  .lg i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .lg i.dot { background: none; border-top: 2px dotted; height: 0; }
  .lg i.tri { width: 0; height: 0; border-radius: 0; border-left: 5px solid transparent; border-right: 5px solid transparent; }
  #eq { height: 260px; } #px { height: 400px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 4px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; border-top: 0; }
  th:first-child, td:first-child { text-align: left; }
  .tscroll { overflow-x: auto; }
  td a { color: var(--accent); text-decoration: none; }
  .note { color: var(--muted); font-size: 12px; margin: 14px 2px 0; line-height: 1.6; }

  .sheet { position: fixed; inset: 0; z-index: 50; }
  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  .sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 760px; margin: 0 auto; max-height: 78vh; overflow-y: auto;
                 background: var(--bg); border-radius: 16px 16px 0 0; padding: 0 14px 18px; }
  .sheet-head { position: sticky; top: 0; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 14px 2px 10px; }
  .sheet-head button { border: 0; background: var(--soft); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 17px; }
  .ritem { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
           padding: 10px 12px; margin-bottom: 6px; cursor: pointer; }
  .ritem b { font-size: 15px; font-weight: 600; } .ritem span { display: block; font-size: 12px; color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #eq { height: 220px; } #px { height: 340px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 首頁</a>
  <h1>回測實驗室</h1>
  <div class="meta" id="meta">用過去兩年的股價，測試一套買賣規則會賺還是賠</div>

  <div class="step"><span class="num">1</span><b>選股票</b></div>
  <div class="box">
    <div class="modes" id="modes">
      <button data-m="single" class="on">單一股票</button><button data-m="multi">多檔比較</button>
    </div>
    <div id="single-box">
      <div class="search">
        <input id="q" type="search" autocomplete="off" placeholder="輸入代號或名稱，例如 2330、台積">
        <div class="sugg" id="sugg" hidden></div>
      </div>
      <div class="picked" id="picked"></div>
    </div>
    <div id="multi-box" hidden>
      <div class="chips" id="msrc">
        <button class="chip on" data-s="watch">我的自選股</button>
        <button class="chip" data-s="top50">成交金額前 50 名</button>
        <button class="chip" data-s="custom">自己輸入代號</button>
      </div>
      <textarea id="mcodes" placeholder="輸入股票代號，用空格或逗號分開，例如：2330 2317 2454" hidden></textarea>
      <div class="hint" id="mhint"></div>
    </div>
  </div>

  <div class="step"><span class="num">2</span><b>選擇方法</b><small>點一個方法，買賣規則會自動填好</small></div>
  <div class="tgrid" id="tpl"></div>
  <div class="tpl-desc" id="tpldesc"></div>
  <div class="step" style="margin-top:16px"><span class="num" style="background:var(--muted)">⚙</span><b style="font-size:15px">買賣規則（可以自己調整）</b></div>
  <div class="box rules">
    <h3><span class="tag buy">買進</span>出現這些訊號就買
      <select id="entrymode"><option value="all">全部條件同時成立</option><option value="any">任一條件成立</option></select></h3>
    <div id="entry"></div>
    <button class="add" data-add="entry">＋ 新增買進條件</button>
    <div class="divider"></div>
    <h3><span class="tag sell">賣出</span>任一條件成立就賣</h3>
    <div id="exit"></div>
    <button class="add" data-add="exit">＋ 新增賣出條件</button>
  </div>

  <div class="step"><span class="num">3</span><b>交易設定</b></div>
  <div class="box settings">
    <label>初始資金（元）<input id="cap" type="number" inputmode="numeric" value="1000000"></label>
    <label>買賣單位<select id="lot"><option value="1">零股（以股為單位）</option><option value="1000">整張（1000 股）</option></select></label>
    <label>手續費折扣（1 = 不打折）<input id="disc" type="number" inputmode="decimal" step="0.05" value="0.6"></label>
    <label>回測期間<select id="period"><option value="all">全部（約兩年）</option><option value="250">最近一年</option><option value="125">最近半年</option></select></label>
  </div>
  <div class="hint">手續費 0.1425% × 折扣（最低 20 元）；證交稅賣出時 0.3%（ETF 0.1%）。訊號在收盤出現，隔天開盤價成交。</div>

  <button class="run" id="run">開始回測</button>
  <button class="save" id="save">儲存這套規則</button>

  <div id="results"></div>

  <p class="note">回測只是用過去的資料模擬，過去有效不代表未來有效。實際交易還會有滑價、漲跌停買不到或賣不掉等狀況。建議多換幾檔股票、不同期間測試，看規則是不是穩定有效，而不是只在某一檔剛好賺錢。</p>
  <footer>僅供學習參考，不構成投資建議</footer>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" id="sheetbg"></div>
  <div class="sheet-panel">
    <div class="sheet-head"><b id="sheettitle">新增條件</b><button id="sheetclose">×</button></div>
    <div id="sheetlist"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (v, d = 1) => v == null || !isFinite(v) ? '—' : (v >= 0 ? '+' : '') + (v * 100).toFixed(d) + '%';
const cls = (v) => v == null ? '' : v >= 0 ? 'up' : 'down';
const money = (v) => Math.round(v).toLocaleString();

// ============================================================
// 指標計算（和 Python 版一致）
// ============================================================
function sma(a, n) { const o = Array(a.length).fill(null); let s = 0;
  for (let i = 0; i < a.length; i++) { s += a[i]; if (i >= n) s -= a[i - n]; if (i >= n - 1) o[i] = s / n; } return o; }
function ema(a, n) { const o = Array(a.length).fill(null), k = 2 / (n + 1); let p = null;
  for (let i = 0; i < a.length; i++) { if (a[i] == null) continue; p = p == null ? a[i] : a[i] * k + p * (1 - k); o[i] = p; } return o; }
function stdev(a, n) { const o = Array(a.length).fill(null);
  for (let i = n - 1; i < a.length; i++) { let m = 0; for (let j = i - n + 1; j <= i; j++) m += a[j]; m /= n;
    let v = 0; for (let j = i - n + 1; j <= i; j++) v += (a[j] - m) ** 2; o[i] = Math.sqrt(v / (n - 1)); } return o; }

function makeInd(P) {
  const cache = {}, get = (k, f) => cache[k] || (cache[k] = f());
  const c = P.c, h = P.h, l = P.l, v = P.v;
  return {
    c, o: P.o, h, l, v, n: c.length,
    ma: (n) => get('ma' + n, () => sma(c, n)),
    macd: () => get('macd', () => { const e12 = ema(c, 12), e26 = ema(c, 26);
      const dif = c.map((_, i) => e12[i] - e26[i]); const dea = ema(dif, 9);
      return { dif: dif.map((x, i) => i < 25 ? null : x), dea: dea.map((x, i) => i < 25 ? null : x) }; }),
    kd: () => get('kd', () => { const K = Array(c.length).fill(null), D = Array(c.length).fill(null); let k = 50, d = 50;
      for (let i = 8; i < c.length; i++) { let hi = -Infinity, lo = Infinity;
        for (let j = i - 8; j <= i; j++) { hi = Math.max(hi, h[j]); lo = Math.min(lo, l[j]); }
        const rsv = hi === lo ? 50 : (c[i] - lo) / (hi - lo) * 100; k = k * 2 / 3 + rsv / 3; d = d * 2 / 3 + k / 3; K[i] = k; D[i] = d; }
      return { K, D }; }),
    rsi: () => get('rsi', () => { const o = Array(c.length).fill(null);
      for (let i = 14; i < c.length; i++) { let g = 0, s = 0;
        for (let j = i - 13; j <= i; j++) { const x = c[j] - c[j - 1]; if (x > 0) g += x; else s -= x; }
        o[i] = s === 0 ? 100 : 100 - 100 / (1 + g / s); } return o; }),
    bb: () => get('bb', () => { const m = sma(c, 20), sd = stdev(c, 20);
      return { up: m.map((x, i) => x == null ? null : x + 2 * sd[i]), low: m.map((x, i) => x == null ? null : x - 2 * sd[i]) }; }),
    vma: (n) => get('vma' + n, () => sma(v, n)),
    hiPrev: (n) => get('hp' + n, () => c.map((_, i) => i < n ? null : Math.max(...c.slice(i - n, i)))),
    loPrev: (n) => get('lp' + n, () => c.map((_, i) => i < n ? null : Math.min(...c.slice(i - n, i)))),
  };
}
const crossUp = (a, b, i) => i > 0 && a[i] != null && b[i] != null && a[i - 1] != null && b[i - 1] != null && a[i] > b[i] && a[i - 1] <= b[i - 1];
const crossDn = (a, b, i) => i > 0 && a[i] != null && b[i] != null && a[i - 1] != null && b[i - 1] != null && a[i] < b[i] && a[i - 1] >= b[i - 1];

// ============================================================
// 規則（買進 / 賣出）
// ============================================================
const RULES = {
  // ---- 買進 ----
  ma_up: { side: 'entry', name: '均線黃金交叉', desc: '短天期均線由下往上穿過長天期均線', p: [['s', '短均線', 5, '日'], ['l', '長均線', 20, '日']],
    warm: (p) => p.l, fn: (I, i, p) => crossUp(I.ma(p.s), I.ma(p.l), i) },
  above_ma: { side: 'entry', name: '收盤突破均線', desc: '收盤價由下往上站上均線', p: [['n', '均線', 20, '日']],
    warm: (p) => p.n, fn: (I, i, p) => crossUp(I.c, I.ma(p.n), i) },
  ma_bull: { side: 'entry', name: '多頭排列', desc: '5 日 > 20 日 > 60 日均線（趨勢向上時持續成立）', p: [],
    warm: () => 60, fn: (I, i) => { const a = I.ma(5)[i], b = I.ma(20)[i], c = I.ma(60)[i]; return a != null && c != null && a > b && b > c; } },
  macd_gx: { side: 'entry', name: 'MACD 黃金交叉', desc: 'DIF 由下往上穿過 MACD 線', p: [],
    warm: () => 35, fn: (I, i) => { const m = I.macd(); return crossUp(m.dif, m.dea, i); } },
  kd_gx: { side: 'entry', name: 'KD 低檔黃金交叉', desc: 'K 線由下往上穿過 D 線，而且 K 值低於設定值', p: [['x', 'K 值低於', 30, '']],
    warm: () => 15, fn: (I, i, p) => { const k = I.kd(); return crossUp(k.K, k.D, i) && k.K[i] < p.x; } },

function backtest(P, cfg, isEtf) {
  const I = makeInd(P), N = I.n;
  const rules = (list) => list.map(([id, p]) => ({ id, R: RULES[id], p: Object.assign({}, ...RULES[id].p.map(([k, , d]) => ({ [k]: d })), p) }));
  const ent = rules(cfg.entry), ex = rules(cfg.exit);
  const warm = Math.max(30, ...ent.map(r => r.R.warm(r.p)), ...ex.map(r => r.R.warm(r.p)));
  let start = Math.min(warm, N - 2);
  if (cfg.period !== 'all') start = Math.max(start, N - +cfg.period);
  const feeRate = 0.001425 * cfg.disc, tax = isEtf ? 0.001 : 0.003, lot = cfg.lot;
  const fee = (amt) => Math.max(20, Math.round(amt * feeRate));
  let cash = cfg.cap, sh = 0, pos = null, pending = null, buyWhy = '', today = null;
  const equity = [], trades = [];
  for (let i = start; i < N; i++) {
    if (pending === 'buy') {
      const pr = I.o[i];
      let n = Math.floor(cash / (pr * (1 + feeRate)) / lot) * lot;
      while (n > 0 && n * pr + fee(n * pr) > cash) n -= lot;
      if (n > 0) { const cost = n * pr + fee(n * pr); cash -= cost; sh = n; pos = { idx: i, date: P.d[i], price: pr, peak: pr, cost, sig: buyWhy }; }
      pending = null;
    } else if (pending && pending.sell) {
      const pr = I.o[i], amt = sh * pr, get = amt - fee(amt) - Math.round(amt * tax);
      cash += get;
      trades.push({ bd: pos.date, bp: pos.price, sd: P.d[i], sp: pr, sh, days: i - pos.idx, ret: get / pos.cost - 1, pnl: get - pos.cost,
                    why: pending.why, bwhy: pos.sig, bi: pos.idx, si: i });
      sh = 0; pos = null; pending = null;
    }
    if (pos) pos.peak = Math.max(pos.peak, I.c[i]);
    equity.push(cash + sh * I.c[i]);
    // 收盤後檢查訊號：最後一天只記錄「今天的訊號」，不成交
    let sig = null;
    if (!pos) {
      const hits = ent.map(r => !!r.R.fn(I, i, r.p));
      if (ent.length && (cfg.mode === 'any' ? hits.some(Boolean) : hits.every(Boolean)))
        sig = { buy: true, why: ent.filter((_, k) => hits[k]).map(r => r.R.name).join('＋') };
    } else {
      const hit = ex.find(r => r.R.fn(I, i, r.p, pos));
      if (hit) sig = { sell: true, why: hit.R.name };
    }
    if (i >= N - 1) { today = sig; break; }
    if (sig && sig.buy) { pending = 'buy'; buyWhy = sig.why; }
    else if (sig && sig.sell) pending = { sell: true, why: sig.why };
  }
  const open = pos ? { bd: pos.date, bp: pos.price, sh, days: N - 1 - pos.idx, ret: (sh * I.c[N - 1] * (1 - feeRate - tax)) / pos.cost - 1, bi: pos.idx, bwhy: pos.sig } : null;
  // 統計
  const final = equity[equity.length - 1], days = equity.length;
  let peak = -Infinity, mdd = 0;
  for (const e of equity) { peak = Math.max(peak, e); mdd = Math.min(mdd, e / peak - 1); }
  const wins = trades.filter(t => t.pnl > 0), loss = trades.filter(t => t.pnl <= 0);
  const gain = wins.reduce((s, t) => s + t.pnl, 0), lossSum = -loss.reduce((s, t) => s + t.pnl, 0);
  // 買進持有：起點隔天開盤買、最後一天收盤計值
  const b0 = I.o[Math.min(start + 1, N - 1)], bhShares = Math.floor(cfg.cap / (b0 * (1 + feeRate)) / lot) * lot;
  const bhCash = cfg.cap - bhShares * b0 - (bhShares ? fee(bhShares * b0) : 0);
  const bhEq = []; for (let i = start; i < N; i++) bhEq.push(i <= start ? cfg.cap : bhCash + bhShares * I.c[i]);
  let bpk = -Infinity, bmdd = 0; for (const e of bhEq) { bpk = Math.max(bpk, e); bmdd = Math.min(bmdd, e / bpk - 1); }
  const inMkt = trades.reduce((s, t) => s + t.days, 0) + (open ? open.days : 0);
  const yrs = days / 250;
  return {
    start, dates: P.d.slice(start), close: I.c.slice(start), equity, bhEq, trades, open, today, I, P, ent, ex,
    lastDate: P.d[N - 1], lastClose: I.c[N - 1],
    ret: final / cfg.cap - 1, cagr: yrs > 0.2 ? Math.pow(final / cfg.cap, 1 / yrs) - 1 : null, mdd,
    bh: bhEq[bhEq.length - 1] / cfg.cap - 1, bhMdd: bmdd,
    n: trades.length, win: trades.length ? wins.length / trades.length : null,
    avg: trades.length ? trades.reduce((s, t) => s + t.ret, 0) / trades.length : null,
    pf: lossSum > 0 ? gain / lossSum : (gain > 0 ? Infinity : null),
    avgDays: trades.length ? trades.reduce((s, t) => s + t.days, 0) / trades.length : null,
    exposure: days ? inMkt / days : 0, final,
  };
}

let LIST = [], NAMES = {}, SCREEN = null, WATCH = [];
let S = { mode: 'single', code: '2330', msrc: 'watch', mcodes: '', tpl: 0, entryMode: 'all',

function renderMode() {
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === S.mode));
  $('single-box').hidden = S.mode !== 'single'; $('multi-box').hidden = S.mode !== 'multi';
  document.querySelectorAll('#msrc .chip').forEach(b => b.classList.toggle('on', b.dataset.s === S.msrc));
  $('mcodes').hidden = S.msrc !== 'custom'; $('mcodes').value = S.mcodes;
  const codes = multiCodes();
  $('mhint').textContent = codes.length ? `共 ${codes.length} 檔：${codes.slice(0, 12).map(c => NAMES[c] || c).join('、')}${codes.length > 12 ? '…' : ''}` : '還沒有股票';
  $('picked').innerHTML = S.code ? `<span>已選</span><b>${esc(S.code)} ${esc(NAMES[S.code] || '')}</b>` : '';
}
function multiCodes() {
  if (S.msrc === 'watch') return WATCH.filter(c => NAMES[c]);
  if (S.msrc === 'top50' && SCREEN) {
    const C = SCREEN.C; return SCREEN.rows.filter(r => !String(r[C.code]).startsWith('00')).sort((a, b) => (b[C.amt] || 0) - (a[C.amt] || 0)).slice(0, 50).map(r => r[C.code]);
  }
  return [...new Set(S.mcodes.toUpperCase().split(/[\s,，、]+/).filter(c => NAMES[c]))].slice(0, 50);
}

function renderTpl() {
  const mine = loadMine();
  $('tpl').innerHTML = TEMPLATES.map((t, i) => `<button class="tcard ${S.tpl === i ? 'on' : ''}" data-t="${i}"><b>${esc(t.name)}</b><span>${esc(t.desc)}</span></button>`).join('')
    + mine.map((t, i) => `<button class="tcard ${S.tpl === 'm' + i ? 'on' : ''}" data-t="m${i}"><span class="x" data-del="${i}">×</span><b>📁 ${esc(t.name)}</b><span>${esc(describeRules(t))}</span></button>`).join('');
  $('tpldesc').textContent = S.tpl == null ? '目前是自訂規則（你修改過範本）。可以按下面的「儲存這套規則」存起來。' : '';
  document.querySelectorAll('#tpl .tcard').forEach(b => b.addEventListener('click', (e) => {
    const k = b.dataset.t;
    if (e.target.dataset.del != null) {
      if (!confirm('刪除這套規則？')) return;
      mine.splice(+e.target.dataset.del, 1); localStorage.setItem('btMine', JSON.stringify(mine)); if (S.tpl === k) S.tpl = null; save(); renderTpl(); return;
    }
    applyTemplate(k);
    if (S.mode === 'single' && $('results').innerHTML) $('run').click();   // 已經回測過就直接重算
  }));
}
function applyTemplate(k) {
  const mine = loadMine(), t = String(k)[0] === 'm' ? mine[+String(k).slice(1)] : TEMPLATES[+k];
  if (!t) return;
  S.tpl = String(k)[0] === 'm' ? String(k) : +k;
  S.entry = JSON.parse(JSON.stringify(t.entry)); S.exit = JSON.parse(JSON.stringify(t.exit)); S.entryMode = t.mode || 'all';
  save(); renderTpl(); renderRules();
}
function describeRules(t) {
  const d = (list) => list.map(([id]) => RULES[id] ? RULES[id].name : '').filter(Boolean).join('、');
  return `買：${d(t.entry)}／賣：${d(t.exit)}`;
}

function ruleHTML(side, [id, p], i) {
  const R = RULES[id];
  const params = R.p.map(([k, label, d, unit]) => `<span>${esc(label)} <input type="number" inputmode="decimal" step="any" data-side="${side}" data-i="${i}" data-k="${k}" value="${p[k] ?? d}"> ${esc(unit)}</span>`).join('');
  return `<div class="rule"><div class="name">${esc(R.name)}</div><button class="del" data-side="${side}" data-del="${i}">×</button>
    ${params ? `<div class="params">${params}</div>` : ''}<div class="desc">${esc(R.desc)}</div></div>`;
}
function renderRules() {
  $('entrymode').value = S.entryMode;
  for (const side of ['entry', 'exit']) {
    $(side).innerHTML = S[side].length ? S[side].map((r, i) => ruleHTML(side, r, i)).join('') : `<div class="empty">還沒有${side === 'entry' ? '買進' : '賣出'}條件</div>`;
  }
  document.querySelectorAll('.rule .del').forEach(b => b.addEventListener('click', () => {
    S[b.dataset.side].splice(+b.dataset.del, 1); S.tpl = null; save(); renderTpl(); renderRules(); }));
  document.querySelectorAll('.rule input').forEach(el => el.addEventListener('change', () => {
    const r = S[el.dataset.side][+el.dataset.i]; r[1] = Object.assign({}, r[1], { [el.dataset.k]: +el.value }); S.tpl = null; save(); renderTpl(); }));
}

const pxCache = {};
async function loadPx(code) {
  if (pxCache[code]) return pxCache[code];
  const r = await fetch(`px/${encodeURIComponent(code)}.json`, { cache: 'no-cache' });
  if (!r.ok) throw new Error('沒有資料');
  return (pxCache[code] = await r.json());
}
function cfg() { return { entry: S.entry, exit: S.exit, mode: S.entryMode, cap: +S.cap || 1000000, lot: +S.lot || 1, disc: +S.disc || 1, period: S.period }; }

$('run').addEventListener('click', async () => {
  if (!S.entry.length || !S.exit.length) { alert('買進和賣出都至少要一個條件。'); return; }
  $('run').disabled = true; $('run').textContent = '計算中…';
  try { if (S.mode === 'single') await runSingle(); else await runMulti(); }
  catch (e) { $('results').innerHTML = `<div class="verdict">回測失敗：${esc(e.message)}</div>`; }
  $('run').disabled = false; $('run').textContent = '開始回測';
  $('results').scrollIntoView({ behavior: 'smooth' });
});

function statBox(label, val, sub, c) { return `<div class="stat"><div class="label">${label}</div><div class="val ${c || ''}">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`; }

let LAST = null, RANGE = null, SEL = null;

function todayBox(r, code) {
  const md = (d) => d.slice(5).replace('-', '/');
  const name = esc(NAMES[code] || code), date = md(r.lastDate);
  if (r.open) {
    const held = `目前<b>持有中</b>：${md(r.open.bd)} 以 ${r.open.bp} 元買進（${esc(r.open.bwhy || '買進訊號')}），到 ${date} 報酬 <b class="${cls(r.open.ret)}">${pct(r.open.ret)}</b>。`;
    return r.today && r.today.sell
      ? `<div class="today sell"><div class="t">照這個方法，${name} 最新狀況（${date} 收盤）</div>${held}<br>⚠ <b>今天出現賣出訊號</b>（${esc(r.today.why)}），照規則下一個交易日開盤賣出。</div>`
      : `<div class="today"><div class="t">照這個方法，${name} 最新狀況（${date} 收盤）</div>${held}<br>今天沒有出現賣出訊號，照規則<b>續抱</b>。</div>`;
  }
  return r.today && r.today.buy
    ? `<div class="today buy"><div class="t">照這個方法，${name} 最新狀況（${date} 收盤）</div>🔔 <b>今天出現買進訊號</b>（${esc(r.today.why)}），照規則下一個交易日開盤買進。</div>`
    : `<div class="today"><div class="t">照這個方法，${name} 最新狀況（${date} 收盤）</div>目前<b>空手</b>，今天沒有買進訊號，照規則<b>繼續觀望</b>。</div>`;
}

function compareMethods(P, code) {
  const mine = loadMine(), base = cfg();
  const list = TEMPLATES.map((t, i) => ({ key: i, name: t.name, t })).concat(mine.map((t, i) => ({ key: 'm' + i, name: '📁 ' + t.name, t })));
  const out = list.map(m => ({ m, r: backtest(P, Object.assign({}, base, { entry: m.t.entry, exit: m.t.exit, mode: m.t.mode || 'all' }), code.startsWith('00')) }));
  out.sort((a, b) => b.r.ret - a.r.ret);
  const rows = out.map((o, k) => `<tr data-k="${o.m.key}" class="${S.tpl === o.m.key ? 'on' : ''}"><td>${k + 1}. ${esc(o.m.name)}</td>
      <td class="${cls(o.r.ret)}">${pct(o.r.ret)}</td><td class="${cls(o.r.ret - o.r.bh)}">${pct(o.r.ret - o.r.bh)}</td>
      <td>${o.r.win == null ? '—' : (o.r.win * 100).toFixed(0) + '%'}</td><td>${o.r.n}</td><td class="down">${pct(o.r.mdd)}</td>
      <td>${o.r.open ? (o.r.today && o.r.today.sell ? '賣' : '持有') : (o.r.today && o.r.today.buy ? '<b class="up">買</b>' : '空手')}</td></tr>`).join('');
  return `<section><h2>方法比較</h2><p class="hint" style="margin:0 0 6px">同一檔股票、同樣的交易設定，所有方法的表現排名。點任一列看那個方法的買賣點。</p>
    <div class="tscroll"><table class="cmp"><tr><th>方法</th><th>報酬</th><th>贏持有</th><th>勝率</th><th>次數</th><th>最大回檔</th><th>今天</th></tr>${rows}</table></div></section>`;
}

async function runSingle() {
  const code = S.code; if (!code) throw new Error('請先選一檔股票');
  const P = await loadPx(code), r = backtest(P, cfg(), code.startsWith('00'));
  LAST = r; SEL = null;
  const beat = r.ret - r.bh;
  const verdict = r.n === 0 && !r.open ? '這段期間沒有出現買進訊號，可以換個方法或放寬參數。'
    : beat >= 0 ? `這套規則在 ${esc(NAMES[code] || code)} 上<b class="up">贏過買進持有 ${(beat * 100).toFixed(1)} 個百分點</b>`
    : `這套規則在 ${esc(NAMES[code] || code)} 上<b class="down">輸給買進持有 ${(-beat * 100).toFixed(1)} 個百分點</b>`;
  const mddNote = r.mdd > r.bhMdd ? (beat >= 0 ? '，而且最大回檔比較小（風險較低）' : '，但最大回檔比較小（風險較低）') : '';
  const curName = typeof S.tpl === 'number' ? TEMPLATES[S.tpl].name : typeof S.tpl === 'string' ? (loadMine()[+S.tpl.slice(1)] || {}).name : '自訂規則';
  const html = `${todayBox(r, code)}
    <div class="verdict"><span class="hint" style="display:block;margin:0 0 4px">方法：${esc(curName || '自訂規則')}</span>${verdict}${r.n || r.open ? mddNote + '。' : ''}</div>
    <section id="sec-px"><h2>買賣點</h2>
      <div class="lg" id="pxlg"></div>
      <div class="rng" id="rng"><button data-r="63">3 個月</button><button data-r="125">6 個月</button><button data-r="0">全部</button></div>
      <div id="px"></div>
      <p class="hint" style="margin:4px 0 0">▲ 買進、▼ 賣出（隔天開盤成交價）；連線紅色 = 這筆賺錢、綠色 = 賠錢。點下面交易明細的任一筆，圖會跳到那一筆。</p></section>
    <div class="stats">
      ${statBox('策略總報酬', pct(r.ret), `${money(r.final)} 元`, cls(r.ret))}
      ${statBox('買進持有', pct(r.bh), '同期間一直抱著', cls(r.bh))}
      ${statBox('年化報酬', pct(r.cagr), '', cls(r.cagr))}
      ${statBox('最大回檔', pct(r.mdd), `買進持有 ${pct(r.bhMdd)}`, 'down')}
      ${statBox('勝率', r.win == null ? '—' : (r.win * 100).toFixed(0) + '%', `${r.n} 筆交易`)}
      ${statBox('獲利因子', r.pf == null ? '—' : r.pf === Infinity ? '∞' : r.pf.toFixed(2), '總獲利 ÷ 總虧損，>1 才賺')}
      ${statBox('平均每筆', pct(r.avg), '已扣手續費與稅', cls(r.avg))}
      ${statBox('平均持有', r.avgDays == null ? '—' : r.avgDays.toFixed(0) + ' 天', '')}
      ${statBox('持股時間', (r.exposure * 100).toFixed(0) + '%', '有持股的天數比例')}
    </div>
    <section><h2>交易明細</h2><p class="hint" style="margin:0 0 6px">每筆顯示日期、成交價和原因。點一筆看它在圖上的位置。</p>${tradeTable(r)}</section>
    ${compareMethods(P, code)}
    <section><h2>資金曲線</h2>
      <div class="lg"><span><i style="background:var(--accent)"></i>這套規則</span><span><i class="dot" style="border-color:var(--muted)"></i>買進持有</span></div>
      <div id="eq"></div></section>`;
  $('results').innerHTML = html;
  RANGE = RANGE ?? (matchMedia('(max-width: 640px)').matches ? 125 : 0);
  document.querySelectorAll('#rng button').forEach(b => b.addEventListener('click', () => { RANGE = +b.dataset.r; SEL = null; drawPx(); }));
  document.querySelectorAll('.trades tr[data-t]').forEach(tr => tr.addEventListener('click', () => {
    SEL = +tr.dataset.t; drawPx(); document.querySelectorAll('.trades tr').forEach(x => x.classList.toggle('sel', x === tr));
    $('sec-px').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  document.querySelectorAll('.cmp tr[data-k]').forEach(tr => tr.addEventListener('click', () => {
    const k = tr.dataset.k; applyTemplate(k[0] === 'm' ? k : +k); runSingle().then(() => $('results').scrollIntoView({ behavior: 'smooth' }));
  }));
  drawPx(); drawEq(r);
}

function tradeTable(r) {
  if (!r.trades.length && !r.open) return '<div class="empty">沒有交易</div>';
  const md = (d) => d.slice(2).replace(/-/g, '/');
  const rows = r.trades.map((t, k) => `<tr data-t="${k}"><td>${md(t.bd)}<br><small>${t.bp}</small><span class="why">${esc(t.bwhy || '')}</span></td>
      <td>${md(t.sd)}<br><small>${t.sp}</small><span class="why">${esc(t.why)}</span></td>
      <td class="${cls(t.ret)}">${pct(t.ret)}</td><td>${t.days} 天</td></tr>`).reverse();
  if (r.open) rows.unshift(`<tr data-t="-1"><td>${md(r.open.bd)}<br><small>${r.open.bp}</small><span class="why">${esc(r.open.bwhy || '')}</span></td><td>持有中</td><td class="${cls(r.open.ret)}">${pct(r.open.ret)}</td><td>${r.open.days} 天</td></tr>`);
  return `<div class="tscroll"><table class="trades"><tr><th>買進</th><th>賣出</th><th>報酬</th><th>持有</th></tr>${rows.join('')}</table></div>`;
}

function chartBase() {
  const css = getComputedStyle(document.documentElement), v = (n) => css.getPropertyValue(n).trim();
  const C = { muted: v('--muted'), grid: v('--grid'), up: v('--up'), down: v('--down'), accent: v('--accent'), ink: v('--ink'), ma5: v('--ma5'), ma60: v('--ma60') };
  const mobile = matchMedia('(max-width: 640px)').matches;
  const font = { family: '-apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif', color: C.muted, size: mobile ? 11 : 12 };
  const xaxis = (x) => { const step = Math.ceil(x.length / (mobile ? 4 : 7)), tv = x.filter((_, i) => i % step === Math.floor(step / 2));
    return { type: 'category', tickvals: tv, ticktext: tv.map(d => x.length > 140 ? d.slice(2, 7).replace('-', '/') : d.slice(5).replace('-', '/')),
             tickangle: 0, showgrid: false, fixedrange: true, tickfont: font, linecolor: C.grid, rangeslider: { visible: false } }; };
  const base = { paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font, showlegend: false, dragmode: false, hovermode: 'closest',
    margin: mobile ? { l: 2, r: 6, t: 6, b: 24 } : { l: 6, r: 10, t: 8, b: 28 },
    yaxis: { side: 'right', gridcolor: C.grid, fixedrange: true, tickfont: font, automargin: true, nticks: 6 } };
  return { C, mobile, font, xaxis, base, cfg: { responsive: true, displayModeBar: false } };
}

// 規則用到的指標線（畫在 K 線圖上）
function overlays(r, C) {
  const I = r.I, out = [], seen = new Set();
  const colors = [C.ma5, C.accent, C.ma60];
  const addMa = (n) => { if (seen.has('ma' + n)) return; seen.add('ma' + n); out.push({ name: `${n} 日均線`, y: I.ma(n), color: colors[out.length % 3] }); };
  for (const rule of [...r.ent, ...r.ex]) {
    const id = rule.id, p = rule.p;
    if (id === 'ma_up' || id === 'ma_dn') { addMa(p.s); addMa(p.l); }
    if (id === 'above_ma' || id === 'below_ma') addMa(p.n);
    if (id === 'ma_bull') { addMa(5); addMa(20); addMa(60); }
    if ((id === 'bb_up' || id === 'bb_low' || id === 'bb_touch') && !seen.has('bb')) {
      seen.add('bb'); const b = I.bb(); out.push({ name: '布林上緣', y: b.up, color: C.muted, dash: 'dot' }, { name: '布林下緣', y: b.low, color: C.muted, dash: 'dot' }); }
    if (id === 'breakout' && !seen.has('hp')) { seen.add('hp'); out.push({ name: `前 ${p.n} 日最高`, y: I.hiPrev(p.n), color: C.muted, dash: 'dash' }); }
    if (id === 'breakdown' && !seen.has('lp')) { seen.add('lp'); out.push({ name: `前 ${p.n} 日最低`, y: I.loPrev(p.n), color: C.muted, dash: 'dash' }); }
  }
  return out;
}

function drawPx() {
  const r = LAST; if (!r) return;
  const { C, xaxis, base, cfg } = chartBase(), I = r.I, P = r.P, N = I.n;
  document.querySelectorAll('#rng button').forEach(b => b.classList.toggle('on', +b.dataset.r === RANGE && SEL == null));
  // 顯示範圍
  let s0 = r.start, s1 = N - 1;
  if (SEL != null) {
    const t = SEL === -1 ? { bi: r.open.bi, si: N - 1 } : r.trades[SEL];
    s0 = Math.max(r.start, t.bi - 25); s1 = Math.min(N - 1, t.si + 25);
  } else if (RANGE) s0 = Math.max(r.start, N - RANGE);
  const sl = (a) => a.slice(s0, s1 + 1), x = sl(P.d), inR = (i) => i >= s0 && i <= s1;
  const ov = overlays(r, C);
  $('pxlg').innerHTML = `<span><i style="background:var(--up)"></i>K 線</span>` + ov.map(o => `<span><i class="${o.dash ? 'dot' : ''}" style="${o.dash ? 'border-color' : 'background'}:${o.color}"></i>${esc(o.name)}</span>`).join('');
  const all = r.trades.map((t, k) => ({ ...t, k })).concat(r.open ? [{ bi: r.open.bi, bp: r.open.bp, si: null, k: -1, ret: r.open.ret, bwhy: r.open.bwhy }] : []);
  const buys = all.filter(t => inR(t.bi)), sells = all.filter(t => t.si != null && inR(t.si));
  const traces = [
    { type: 'candlestick', x, open: sl(I.o), high: sl(I.h), low: sl(I.l), close: sl(I.c), hoverinfo: 'skip',
      increasing: { line: { color: C.up, width: 1 }, fillcolor: C.up }, decreasing: { line: { color: C.down, width: 1 }, fillcolor: C.down } },
    ...ov.map(o => ({ type: 'scatter', mode: 'lines', x, y: sl(o.y), line: { color: o.color, width: 1.3, dash: o.dash }, hoverinfo: 'skip' })),
    { type: 'scatter', mode: 'markers+text', x: buys.map(t => P.d[t.bi]), y: buys.map(t => I.l[t.bi] * 0.985), text: buys.map(() => '買'),
      textposition: 'bottom center', textfont: { color: C.up, size: 12 }, marker: { symbol: 'triangle-up', size: buys.map(t => t.k === SEL ? 16 : 12), color: C.up },
      hovertext: buys.map(t => `買進 ${t.bp}<br>${t.bwhy || ''}`), hoverinfo: 'text' },
    { type: 'scatter', mode: 'markers+text', x: sells.map(t => P.d[t.si]), y: sells.map(t => I.h[t.si] * 1.015), text: sells.map(() => '賣'),
      textposition: 'top center', textfont: { color: C.down, size: 12 }, marker: { symbol: 'triangle-down', size: sells.map(t => t.k === SEL ? 16 : 12), color: C.down },
      hovertext: sells.map(t => `賣出 ${t.sp}（${pct(t.ret)}）<br>${t.why}`), hoverinfo: 'text' },
  ];
  // 買點到賣點的連線（紅 = 賺、綠 = 賠）
  const shapes = all.filter(t => t.si != null && inR(t.bi) && inR(t.si)).map(t => ({
    type: 'line', xref: 'x', yref: 'y', x0: P.d[t.bi], x1: P.d[t.si], y0: t.bp, y1: t.sp,
    line: { color: t.ret >= 0 ? C.up : C.down, width: t.k === SEL ? 3 : 1.6, dash: 'dot' } }));
  Plotly.react('px', traces, Object.assign({}, base, { xaxis: xaxis(x), shapes }), cfg);
}

function drawEq(r) {
  const { C, xaxis, base, cfg } = chartBase(), x = r.dates, cap = r.equity[0];
  Plotly.react('eq', [
    { type: 'scatter', mode: 'lines', x, y: r.equity.map(e => (e / cap - 1) * 100), line: { color: C.accent, width: 2 }, hovertemplate: '規則 %{y:+.1f}%<extra></extra>' },
    { type: 'scatter', mode: 'lines', x, y: r.bhEq.map(e => (e / cap - 1) * 100), line: { color: C.muted, width: 1.5, dash: 'dot' }, hovertemplate: '持有 %{y:+.1f}%<extra></extra>' },
  ], Object.assign({}, base, { hovermode: 'x unified', xaxis: xaxis(x), yaxis: Object.assign({}, base.yaxis, { ticksuffix: '%', zeroline: true, zerolinecolor: C.muted }) }), cfg);
}

async function runMulti() {
  const codes = multiCodes();
  if (!codes.length) throw new Error('請先選擇要比較的股票');
  const c = cfg(), out = [];
  for (let k = 0; k < codes.length; k++) {
    $('run').textContent = `計算中…（${k + 1}/${codes.length}）`;
    try { const P = await loadPx(codes[k]); out.push({ code: codes[k], r: backtest(P, c, codes[k].startsWith('00')) }); } catch (e) {}
  }
  if (!out.length) throw new Error('這些股票都沒有資料');
  const avg = (f) => out.reduce((s, o) => s + f(o.r), 0) / out.length;
  const beat = out.filter(o => o.r.ret > o.r.bh).length, profit = out.filter(o => o.r.ret > 0).length;
  out.sort((a, b) => b.r.ret - a.r.ret);
  const rows = out.map(o => `<tr><td><a href="?code=${encodeURIComponent(o.code)}" data-code="${esc(o.code)}">${esc(o.code)} ${esc(NAMES[o.code] || '')}</a></td>
      <td class="${cls(o.r.ret)}">${pct(o.r.ret)}</td><td class="${cls(o.r.bh)}">${pct(o.r.bh)}</td><td>${o.r.n}</td>
      <td>${o.r.win == null ? '—' : (o.r.win * 100).toFixed(0) + '%'}</td><td class="down">${pct(o.r.mdd)}</td></tr>`).join('');
  $('results').innerHTML = `<div class="verdict">在 ${out.length} 檔股票中，這套規則<b>${beat} 檔贏過買進持有</b>（${(beat / out.length * 100).toFixed(0)}%），${profit} 檔有賺錢。
      ${beat / out.length >= 0.5 ? '表現算穩定。' : '多數股票不如一直抱著，規則可能只適合特定股票或行情。'}</div>
    <div class="stats">
      ${statBox('平均報酬', pct(avg(r => r.ret)), '', cls(avg(r => r.ret)))}
      ${statBox('買進持有平均', pct(avg(r => r.bh)), '', cls(avg(r => r.bh)))}
      ${statBox('平均最大回檔', pct(avg(r => r.mdd)), `持有 ${pct(avg(r => r.bhMdd))}`, 'down')}
    </div>
    <section><h2>各股結果</h2><p class="hint" style="margin:0 0 6px">點股票名稱看那一檔的詳細回測。</p>
      <div class="tscroll"><table><tr><th>股票</th><th>策略</th><th>持有</th><th>次數</th><th>勝率</th><th>最大回檔</th></tr>${rows}</table></div></section>`;
  $('results').querySelectorAll('a[data-code]').forEach(a => a.addEventListener('click', (e) => {
    e.preventDefault(); S.code = a.dataset.code; S.mode = 'single'; save(); renderMode(); $('run').click(); }));
}

// ============================================================
// 載入股票清單
// ============================================================
try { const v = JSON.parse(localStorage.getItem('watch')); if (Array.isArray(v)) WATCH = v; } catch (e) {}
Promise.all([fetch('list.json', { cache: 'no-cache' }).then(r => r.json()), fetch('screen.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null)])
  .then(([L, SC]) => {
    LIST = L.stocks; LIST.forEach(s => NAMES[s[0]] = s[1]);
    if (!WATCH.length) WATCH = L.watch || [];
    if (SC) { SCREEN = { rows: SC.rows, C: Object.fromEntries(SC.cols.map((c, i) => [c, i])) }; }
    $('meta').textContent = `用過去兩年的股價，測試一套買賣規則會賺還是賠（資料到 ${L.date}）`;
    renderMode();
    if (urlCode) $('run').click();
  });
renderMode(); renderTpl(); renderRules();
</script>
