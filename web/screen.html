<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<title>智慧選股｜台股學習站</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e4e2db; --soft: #efeee8;
    --up: #d1342c; --down: #1a8a4a; --warn: #c27c0e; --accent: #2f6fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9c9a92; --line: #2e2d2a; --soft: #2a2926;
      --up: #f0574e; --down: #3cbf72; --warn: #e8a53a; --accent: #5b92ec;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5;
         font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 12px 16px 60px; }
  .back { color: var(--muted); text-decoration: none; font-size: 15px; display: inline-block; padding: 6px 0; }
  h1 { font-size: 22px; margin: 4px 0 0; }
  .meta { color: var(--muted); font-size: 13px; margin: 2px 0 16px; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 18px 4px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 small { font-weight: 400; font-size: 13px; }

  /* 一鍵策略 */
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 7px 13px;
            cursor: pointer; font-size: 14px; }
  .preset.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .pgroup { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .pgroup > b { flex: none; width: 52px; font-size: 13px; color: var(--muted); padding-top: 8px; }
  .pgroup .presets { flex: 1; min-width: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
                     -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent);
                     padding-right: 24px; }
  .pgroup .presets::-webkit-scrollbar { display: none; }
  .pgroup .preset { flex: none; white-space: nowrap; }
  .preset.mine { border-style: dashed; }
  .preset .x { margin-left: 6px; opacity: .6; }
  .bt { margin: 8px 4px 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  .bt-row { display: flex; gap: 8px; margin-top: 6px; }
  .bt-row div { flex: 1; background: var(--soft); border-radius: 8px; padding: 6px 8px; text-align: center; }
  .bt-row b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .bt-row span { font-size: 11px; color: var(--muted); }
  .bt small { display: block; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .save-btn { border: 1px solid var(--accent) !important; color: var(--accent) !important; }
  .preset-desc { font-size: 13px; color: var(--muted); margin: 8px 4px 0; min-height: 1em; }
  .preset-desc b { color: var(--ink); }

  /* 條件 */
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; }
  .cond { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .cond:first-child { border-top: none; }
  .cond .label { font-weight: 600; font-size: 15px; align-self: center; }
  .cond .del { border: 0; background: var(--soft); color: var(--muted); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
  .cond .ctrl { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cond .hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .ctrl select, .ctrl input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 8px; font-size: 15px; }
  .ctrl input { width: 84px; font-variant-numeric: tabular-nums; }
  .ctrl .unit { color: var(--muted); font-size: 14px; }
  .empty-cond { color: var(--muted); font-size: 14px; padding: 14px 0; text-align: center; }
  .add-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-row select { flex: 1; min-width: 0; border: 1px dashed var(--accent); color: var(--accent); background: var(--panel);
                    border-radius: 10px; padding: 10px; font-size: 15px; }
  .add-row button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 0 14px; color: var(--muted); cursor: pointer; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 4px 0; font-size: 14px; color: var(--muted); }
  .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .opts input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* 結果 */
  .res-head { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center;
              justify-content: space-between; gap: 8px; padding: 10px 4px 8px; margin-top: 10px; }
  .count { font-size: 17px; font-weight: 700; }
  .count small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .sort { display: flex; gap: 4px; align-items: center; }
  .sort select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 8px; font-size: 14px; }
  .sort button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px; border-top: 1px solid var(--line);
         color: inherit; text-decoration: none; }
  .row:first-child { border-top: none; }
  a.row:active, a.row:hover { background: var(--soft); }
  .who { min-width: 0; }
  .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--soft); color: var(--muted); }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 4px; font-weight: 600; }
  .badge.d { background: var(--up); color: #fff; } .badge.c { background: var(--warn); color: #fff; }
  .badge.a { border: 1px solid var(--warn); color: var(--warn); }
  .px { text-align: right; font-variant-numeric: tabular-nums; }
  .close { font-weight: 700; font-size: 16px; }
  .chg { display: block; font-size: 13px; font-weight: 600; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--soft); color: var(--ink); font-variant-numeric: tabular-nums; }
  .chip i { font-style: normal; color: var(--muted); margin-right: 3px; }
  .more { display: block; width: 100%; margin-top: 10px; border: 1px solid var(--line); background: var(--panel);
          border-radius: 10px; padding: 12px; color: var(--accent); cursor: pointer; }
  .nores { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 14px; }
  .note { color: var(--muted); font-size: 12px; margin: 14px 4px 0; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 首頁</a>
  <h1>智慧選股</h1>
  <div class="meta" id="meta">載入中…</div>

  <h2><span>一鍵策略</span><small>左右滑動看更多</small></h2>
  <div id="presets"></div>
  <div class="preset-desc" id="pdesc"></div>
  <div class="bt" id="bt" hidden></div>

  <h2><span>我的條件</span><small>全部條件都要符合</small></h2>
  <div class="box" id="conds"></div>
  <div class="add-row">
    <select id="add"><option value="">＋ 新增條件…</option></select>
    <button id="save" class="save-btn">儲存</button>
    <button id="clear">清除</button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="noetf" checked>只看個股（排除 ETF）</label>
    <label><input type="checkbox" id="noalert">排除處置 / 注意股</label>
    <label><input type="checkbox" id="onlywatch">只看我的自選股</label>
  </div>

  <div class="res-head">
    <div class="count" id="count">—</div>
    <div class="sort">
      <select id="sortk"></select>
      <button id="sortd" aria-label="排序方向">↓</button>
    </div>
  </div>
  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>顯示更多</button>

  <p class="note">選股結果是依照最近一個交易日收盤後的資料計算，只是幫你縮小研究範圍，不代表買賣建議。點任一檔看完整報告與白話解釋。</p>
  <footer id="foot">僅供學習參考，不構成投資建議</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- 可以篩選的欄位 ----------
const YESNO = [[1, '是'], [0, '否']];
const CROSS = [[1, '黃金交叉（近 3 日）'], [-1, '死亡交叉（近 3 日）']];
const FIELDS = [
  { g: '價格', k: 'close', label: '收盤價', type: 'num', unit: '元', def: 50, hint: '最近一個交易日的收盤價' },
  { g: '價格', k: 'chg', label: '今日漲跌幅', type: 'num', unit: '%', def: 3, hint: '跟前一天比漲跌了多少' },
  { g: '價格', k: 'ret5', label: '5 日漲跌幅', type: 'num', unit: '%', def: 5, hint: '最近一週的漲跌' },
  { g: '價格', k: 'ret20', label: '20 日漲跌幅', type: 'num', unit: '%', def: 10, hint: '最近一個月的漲跌' },
  { g: '價格', k: 'amp', label: '今日振幅', type: 'num', unit: '%', def: 5, hint: '(最高 − 最低) ÷ 昨收，越大代表盤中震盪越劇烈' },
  { g: '價格', k: 'dist_hi', label: '距一年高點', type: 'num', unit: '%', def: -10, op: 'ge', hint: '0 = 就在一年高點；-20 = 比高點低 20%' },
  { g: '新高 / 破底', k: 'nh20', label: '今日創 20 日新高', type: 'enum', opts: YESNO, hint: '收盤價是最近 20 個交易日最高' },
  { g: '新高 / 破底', k: 'nh60', label: '今日創 60 日新高', type: 'enum', opts: YESNO, hint: '收盤價是最近一季最高' },
  { g: '新高 / 破底', k: 'nh240', label: '今日創一年新高', type: 'enum', opts: YESNO, hint: '收盤價是最近一年最高' },
  { g: '新高 / 破底', k: 'nh_days', label: '近 10 日創 60 日新高天數', type: 'num', unit: '天', def: 3, hint: '天數越多，代表越常創新高（持續創新高）' },
  { g: '新高 / 破底', k: 'nh_streak', label: '連續創 20 日新高天數', type: 'num', unit: '天', def: 3, hint: '連續好幾天都收在新高' },
  { g: '新高 / 破底', k: 'nl20', label: '今日破 20 日新低', type: 'enum', opts: YESNO, hint: '收盤價是最近 20 個交易日最低' },
  { g: '新高 / 破底', k: 'nl60', label: '今日破 60 日新低（破底）', type: 'enum', opts: YESNO, hint: '收盤價是最近一季最低' },
  { g: '新高 / 破底', k: 'nl240', label: '今日創一年新低', type: 'enum', opts: YESNO, hint: '收盤價是最近一年最低' },
  { g: '新高 / 破底', k: 'nl_days', label: '近 10 日破 60 日新低天數', type: 'num', unit: '天', def: 3, hint: '天數越多，代表一直在破底' },
  { g: '新高 / 破底', k: 'nl_streak', label: '連續破 20 日新低天數', type: 'num', unit: '天', def: 3, hint: '連續好幾天都收在新低' },
  { g: '型態', k: 'ma_break', label: '均線糾結突破', type: 'enum', opts: YESNO, hint: '5、10、20 日均線擠在一起（3% 以內）後，今天收盤往上突破' },
  { g: '型態', k: 'ma_tight', label: '均線糾結中', type: 'enum', opts: YESNO, hint: '5、10、20 日均線距離在 2% 以內，常在大漲或大跌之前' },
  { g: '型態', k: 'box_break', label: '箱型突破', type: 'enum', opts: YESNO, hint: '過去 20 天在 15% 區間內盤整，今天收盤突破區間最高價' },
  { g: '型態', k: 'gap_up', label: '跳空上漲', type: 'enum', opts: YESNO, hint: '今天最低價比昨天最高價還高，留下向上缺口' },
  { g: '型態', k: 'gap_down', label: '跳空下跌', type: 'enum', opts: YESNO, hint: '今天最高價比昨天最低價還低，留下向下缺口' },
  { g: '型態', k: 'bb_up', label: '突破布林通道上緣', type: 'enum', opts: YESNO, hint: '收盤價高於布林通道上緣（20 日均線 + 2 倍標準差），強勢但也可能過熱' },
  { g: '型態', k: 'bb_down', label: '跌破布林通道下緣', type: 'enum', opts: YESNO, hint: '收盤價低於布林通道下緣，弱勢但也可能超跌' },
  { g: '型態', k: 'bb_width', label: '布林通道寬度', type: 'num', unit: '%', def: 8, op: 'le', hint: '通道越窄代表波動越小，常是變盤前兆' },
  { g: '型態', k: 'long_red', label: '長紅 K 棒', type: 'enum', opts: YESNO, hint: '收盤比開盤高 4% 以上，且當天漲 4% 以上' },
  { g: '型態', k: 'long_black', label: '長黑 K 棒', type: 'enum', opts: YESNO, hint: '收盤比開盤低 4% 以上，且當天跌 4% 以上' },
  { g: '型態', k: 'limit_up', label: '漲停（漲 9.5% 以上）', type: 'enum', opts: YESNO },
  { g: '型態', k: 'engulf', label: '多頭吞噬', type: 'enum', opts: YESNO, hint: '昨天收黑，今天收紅而且紅 K 實體完全包住昨天的黑 K' },
  { g: '成交量', k: 'vol', label: '成交量', type: 'num', unit: '張', def: 1000, hint: '今天成交幾張（1 張 = 1000 股），太少的股票不好買賣' },
  { g: '成交量', k: 'vr', label: '量比', type: 'num', unit: '倍', def: 2, hint: '今日量 ÷ 5 日均量，大於 1 代表比平常熱絡' },
  { g: '成交量', k: 'vma20', label: '20 日均量', type: 'num', unit: '張', def: 500, hint: '最近一個月平均每天成交幾張' },
  { g: '成交量', k: 'amt', label: '成交金額', type: 'num', unit: '億', def: 1, hint: '今天成交了多少錢' },
  { g: '法人籌碼', k: 'f_net', label: '外資買賣超（今日）', type: 'num', unit: '張', def: 500, hint: '正數 = 買超，負數 = 賣超' },
  { g: '法人籌碼', k: 't_net', label: '投信買賣超（今日）', type: 'num', unit: '張', def: 100, hint: '投信（基金）常買中小型股，連續買超很受關注' },
  { g: '法人籌碼', k: 'd_net', label: '自營商買賣超（今日）', type: 'num', unit: '張', def: 100, hint: '券商自己的部位，偏短線' },
  { g: '法人籌碼', k: 'i_net', label: '三大法人合計買賣超', type: 'num', unit: '張', def: 1000, hint: '外資 + 投信 + 自營商' },
  { g: '法人籌碼', k: 'f_5', label: '外資近 5 日買賣超', type: 'num', unit: '張', def: 1000, hint: '最近一週累計' },
  { g: '法人籌碼', k: 't_5', label: '投信近 5 日買賣超', type: 'num', unit: '張', def: 300, hint: '最近一週累計' },
  { g: '法人籌碼', k: 'f_streak', label: '外資連續買超天數', type: 'num', unit: '天', def: 3, hint: '負數代表連續賣超的天數' },
  { g: '法人籌碼', k: 't_streak', label: '投信連續買超天數', type: 'num', unit: '天', def: 3, hint: '負數代表連續賣超的天數' },
  { g: '法人籌碼', k: 'd_streak', label: '自營商連續買超天數', type: 'num', unit: '天', def: 3, hint: '負數代表連續賣超的天數' },
  { g: '法人籌碼', k: 'i_ratio', label: '法人買超佔成交量', type: 'num', unit: '%', def: 20, hint: '三大法人買超張數 ÷ 今日成交量，越高代表法人越積極' },
  { g: '信用 / 大戶', k: 'mg_chg', label: '融資增減（今日）', type: 'num', unit: '張', def: 0, op: 'le', hint: '融資是散戶借錢買股。融資減少、股價上漲，代表籌碼比較安定' },
  { g: '信用 / 大戶', k: 'mg_streak', label: '融資連續增加天數', type: 'num', unit: '天', def: -3, op: 'le', hint: '負數代表融資連續減少的天數' },
  { g: '信用 / 大戶', k: 'mg_bal', label: '融資餘額', type: 'num', unit: '張', def: 1000 },
  { g: '信用 / 大戶', k: 'ss_ratio', label: '券資比', type: 'num', unit: '%', def: 20, hint: '融券 ÷ 融資。比例高代表放空的人多，股價上漲時可能出現軋空' },
  { g: '信用 / 大戶', k: 'big1000', label: '千張大戶持股比例', type: 'num', unit: '%', def: 60, hint: '持有 1000 張以上的大股東，合計持股佔多少（每週更新）' },
  { g: '信用 / 大戶', k: 'chg1000', label: '千張大戶持股週增減', type: 'num', unit: '百分點', def: 0.5, hint: '跟上週比，大戶持股比例增加或減少多少' },
  { g: '信用 / 大戶', k: 'chg_people', label: '股東人數週增減', type: 'num', unit: '%', def: 0, op: 'le', hint: '股東人數減少，通常代表籌碼往大戶集中' },
  { g: '營收', k: 'rev_yoy', label: '月營收年增率', type: 'num', unit: '%', def: 20, hint: '最新一個月營收，比去年同月成長多少' },
  { g: '營收', k: 'rev_mom', label: '月營收月增率', type: 'num', unit: '%', def: 10, hint: '比上個月成長多少（容易受季節影響）' },
  { g: '營收', k: 'rev_cum_yoy', label: '今年累計營收年增率', type: 'num', unit: '%', def: 10, hint: '今年到目前為止的營收，比去年同期成長多少' },
  { g: '營收', k: 'rev_hi12', label: '月營收創 12 個月新高', type: 'enum', opts: YESNO, hint: '最新一個月的營收是近一年最高' },
  { g: '營收', k: 'rev_hi24', label: '月營收創 24 個月新高', type: 'enum', opts: YESNO, hint: '最新一個月的營收是近兩年最高' },

let COLS = {}, ROWS = [], SHOWN = 100;
let S = { conds: [], preset: null, noetf: true, noalert: false, sort: 'chg', dir: -1 };
try { const v = JSON.parse(localStorage.getItem('screen')); if (v && Array.isArray(v.conds)) S = Object.assign(S, v); } catch (e) {}

const val = (row, k) => row[COLS[k]];

// ---------- 畫面 ----------
let BT = {}, BT_RANGE = '', WATCH = [];
const loadMine = () => { try { const v = JSON.parse(localStorage.getItem('myStrategies')); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
const saveMine = (v) => { try { localStorage.setItem('myStrategies', JSON.stringify(v)); } catch (e) {} };

function applyStrategy(key, p) {
  if (S.preset === key) { S.preset = null; S.conds = []; }
  else { S.preset = key; S.conds = p.c.map(c => Object.assign({}, c)); S.sort = p.sort || 'chg'; S.dir = p.dir || -1; }
  SHOWN = 100; save(); renderAll();
  $('count').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderPresets() {
  const mine = loadMine();
  const groups = [...new Set(PRESETS.map(p => p.grp))];
  let html = '';
  if (mine.length) {
    html += `<div class="pgroup"><b>我的</b><div class="presets">${mine.map((p, i) =>
      `<button class="preset mine ${S.preset === 'm' + i ? 'on' : ''}" data-m="${i}">${esc(p.name)}<span class="x" data-del="${i}">×</span></button>`).join('')}</div></div>`;
  }
  html += groups.map(g => `<div class="pgroup"><b>${esc(g)}</b><div class="presets">${PRESETS.map((p, i) => p.grp === g
    ? `<button class="preset ${S.preset === i ? 'on' : ''}" data-i="${i}">${esc(p.name)}</button>` : '').join('')}</div></div>`).join('');
  $('presets').innerHTML = html;
  document.querySelectorAll('.pgroup .preset.on').forEach(el => {   // 選到的策略捲到看得見的位置
    const row = el.parentElement; row.scrollLeft = Math.max(0, el.offsetLeft - row.offsetLeft - 40);
  });
  document.querySelectorAll('.preset[data-i]').forEach(b => b.addEventListener('click', () => applyStrategy(+b.dataset.i, PRESETS[+b.dataset.i])));
  document.querySelectorAll('.preset[data-m]').forEach(b => b.addEventListener('click', (e) => {
    const i = +b.dataset.m;
    if (e.target.dataset.del != null) {
      if (!confirm(`刪除「${mine[i].name}」？`)) return;
      mine.splice(i, 1); saveMine(mine); if (S.preset === 'm' + i) S.preset = null; save(); renderAll(); return;
    }
    applyStrategy('m' + i, mine[i]);
  }));
  const cur = typeof S.preset === 'number' ? PRESETS[S.preset] : (typeof S.preset === 'string' ? mine[+S.preset.slice(1)] : null);
  $('pdesc').innerHTML = cur ? `<b>${esc(cur.name)}：</b>${esc(cur.desc || describe(cur.c))}（再點一次取消）`
    : '點一個策略，條件會自動填好，你也可以再自己調整，按「儲存」存成自己的策略。';
  const st = cur && BT[cur.name], base = BT._base;
  if (st && base) {
    const col = (v) => v >= 0 ? 'up' : 'down';
    $('bt').innerHTML = `<b>過去表現回測</b>（${esc(BT_RANGE)}，出現 ${st.n.toLocaleString()} 次）
      <div class="bt-row">
        <div><b class="${col(st.avg5)}">${st.avg5 >= 0 ? '+' : ''}${st.avg5}%</b><span>5 天後平均</span></div>
        <div><b class="${col(st.avg20)}">${st.avg20 >= 0 ? '+' : ''}${st.avg20}%</b><span>20 天後平均</span></div>
        <div><b>${st.win20}%</b><span>20 天後上漲機率</span></div>
      </div>
      <small>比較：同期間任意一天買進，20 天後平均 ${base.avg20 >= 0 ? '+' : ''}${base.avg20}%、上漲機率 ${base.win20}%。
      回測是「出現訊號當天收盤買進、持有 N 天」的平均結果，不含手續費與交易稅；過去表現不代表未來。</small>`;
    $('bt').hidden = false;
  } else { $('bt').hidden = true; }
}

function describe(conds) {
  return conds.map(c => {
    const f = F[c.k]; if (!f) return '';
    if (f.type === 'enum') { const o = f.opts.find(([v]) => String(v) === String(c.a)); return `${f.label}：${o ? o[1] : c.a}`; }
    const u = f.unit || '';
    return c.op === 'bt' ? `${f.label} ${c.a}～${c.b}${u}` : `${f.label} ${c.op === 'ge' ? '≥' : '≤'} ${c.a}${u}`;
  }).filter(Boolean).join('、');
}

function condCtrl(c, i) {
  const f = F[c.k];
  if (f.type === 'enum') {
    return `<select data-i="${i}" data-p="a">${f.opts.map(([v, t]) => `<option value="${esc(v)}" ${String(c.a) === String(v) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  }
  const num = (p, v) => `<input type="number" inputmode="decimal" step="any" data-i="${i}" data-p="${p}" value="${v ?? ''}">`;
  return `<select data-i="${i}" data-p="op">
      <option value="ge" ${c.op === 'ge' ? 'selected' : ''}>大於等於</option>
      <option value="le" ${c.op === 'le' ? 'selected' : ''}>小於等於</option>
      <option value="bt" ${c.op === 'bt' ? 'selected' : ''}>介於</option></select>
    ${num('a', c.a)}${c.op === 'bt' ? `<span class="unit">～</span>${num('b', c.b)}` : ''}<span class="unit">${esc(f.unit || '')}</span>`;
}

function renderConds() {
  const box = $('conds');
  if (!S.conds.length) { box.innerHTML = '<div class="empty-cond">還沒有條件。點上面的一鍵策略，或從下面新增條件。</div>'; return; }
  box.innerHTML = S.conds.map((c, i) => {
    const f = F[c.k];
    return `<div class="cond"><div class="label">${esc(f.label)}</div><button class="del" data-del="${i}" aria-label="刪除">×</button>
      <div class="ctrl">${condCtrl(c, i)}</div>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
  }).join('');
  box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    S.conds.splice(+b.dataset.del, 1); S.preset = null; SHOWN = 100; save(); renderAll();
  }));
  box.querySelectorAll('[data-p]').forEach(el => el.addEventListener('change', () => {
    const c = S.conds[+el.dataset.i], p = el.dataset.p;
    if (p === 'op') { c.op = el.value; if (c.op === 'bt' && c.b == null) c.b = c.a; renderConds(); }
    else if (F[c.k].type === 'enum') { const o = F[c.k].opts.find(([v]) => String(v) === el.value); c.a = o ? o[0] : el.value; }
    else c[p] = el.value === '' ? null : +el.value;
    S.preset = null; SHOWN = 100; save(); renderPresets(); renderResults();
  }));
}

function renderAdd() {
  const groups = [...new Set(FIELDS.map(f => f.g))];
  $('add').innerHTML = '<option value="">＋ 新增條件…</option>' + groups.map(g =>
    `<optgroup label="${esc(g)}">${FIELDS.filter(f => f.g === g).map(f => `<option value="${f.k}">${esc(f.label)}</option>`).join('')}</optgroup>`).join('');
}
$('add').addEventListener('change', (e) => {
  const f = F[e.target.value];
  if (!f) return;
  S.conds.push(f.type === 'enum' ? { k: f.k, op: 'eq', a: f.opts[0] ? f.opts[0][0] : '' } : { k: f.k, op: f.op || 'ge', a: f.def });
  S.preset = null; SHOWN = 100; e.target.value = ''; save(); renderAll();
});
$('save').addEventListener('click', () => {
  if (!S.conds.length) { alert('先設定條件，再儲存。'); return; }
  const name = (prompt('幫這個策略取個名字：', '我的策略 ' + (loadMine().length + 1)) || '').trim();
  if (!name) return;
  const mine = loadMine();
  mine.push({ name, c: S.conds.map(c => Object.assign({}, c)), sort: S.sort, dir: S.dir });
  saveMine(mine); S.preset = 'm' + (mine.length - 1); save(); renderAll();
});
$('onlywatch').addEventListener('change', (e) => { S.onlywatch = e.target.checked; SHOWN = 100; save(); renderResults(); });
$('clear').addEventListener('click', () => { S.conds = []; S.preset = null; SHOWN = 100; save(); renderAll(); });
$('noetf').addEventListener('change', (e) => { S.noetf = e.target.checked; SHOWN = 100; save(); renderResults(); });
$('noalert').addEventListener('change', (e) => { S.noalert = e.target.checked; SHOWN = 100; save(); renderResults(); });
$('sortk').addEventListener('change', (e) => { S.sort = e.target.value; save(); renderResults(); });
$('sortd').addEventListener('click', () => { S.dir = -S.dir; save(); renderResults(); });
$('more').addEventListener('click', () => { SHOWN += 100; renderResults(); });

function match(row) {
  if (S.noetf && String(val(row, 'code')).startsWith('00')) return false;
  if (S.noalert && val(row, 'flag')) return false;
  if (S.onlywatch && !WATCH.includes(val(row, 'code'))) return false;
  for (const c of S.conds) {
    const v = val(row, c.k), f = F[c.k];
    if (f.type === 'enum') { if (String(v ?? '') !== String(c.a)) return false; continue; }
    if (v == null) return false;
    if (c.op === 'ge' && c.a != null && v < c.a) return false;
    if (c.op === 'le' && c.a != null && v > c.a) return false;
    if (c.op === 'bt') {
      const lo = Math.min(c.a ?? -Infinity, c.b ?? Infinity), hi = Math.max(c.a ?? -Infinity, c.b ?? Infinity);
      if (v < lo || v > hi) return false;
    }
  }
  return true;
}

function fmtChip(k, v) {
  const f = F[k];
  if (v == null) return '';
  if (f && f.type === 'enum') { const o = f.opts.find(([x]) => String(x) === String(v)); return o ? o[1] : ''; }
  const unit = f ? f.unit : '';
  const n = Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : (+v.toFixed(2)).toString();
  return n + (unit === '%' ? '%' : unit ? ' ' + unit : '');
}

function renderResults() {
  $('sortk').innerHTML = SORTS.map(([k, t]) => `<option value="${k}" ${S.sort === k ? 'selected' : ''}>${t}</option>`).join('');
  $('sortd').textContent = S.dir < 0 ? '↓' : '↑';
  $('noetf').checked = S.noetf; $('noalert').checked = S.noalert; $('onlywatch').checked = !!S.onlywatch;
  const hits = ROWS.filter(match);
  hits.sort((a, b) => {
    const x = val(a, S.sort), y = val(b, S.sort);
    if (x == null) return 1; if (y == null) return -1;
    return (x - y) * S.dir;
  });
  $('count').innerHTML = `符合 ${hits.length} 檔<small>／共 ${ROWS.length} 檔</small>`;
  const keys = [...new Set(S.conds.map(c => c.k).filter(k => !['market', 'ind', 'flag'].includes(k)))].slice(0, 5);
  if (!keys.includes(S.sort) && !['chg'].includes(S.sort)) keys.push(S.sort);
  if (!keys.includes('cap')) keys.push('cap');
  $('list').innerHTML = hits.length ? hits.slice(0, SHOWN).map(r => {
    const code = val(r, 'code'), chg = val(r, 'chg') ?? 0, flag = val(r, 'flag');
    const cls = chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat', arrow = chg > 0 ? '▲' : chg < 0 ? '▼' : '';
    const badge = { d: '處置', c: '可能處置', a: '注意' }[flag];
    const chips = keys.map(k => { const t = fmtChip(k, val(r, k)); return t ? `<span class="chip"><i>${esc(F[k] ? F[k].label.replace(/（.*?）/, '') : k)}</i>${esc(t)}</span>` : ''; }).join('');
    return `<a class="row" href="report.html?code=${encodeURIComponent(code)}">
      <div class="who"><div class="name">${esc(val(r, 'name'))}</div>
        <div class="sub"><span>${esc(code)}</span><span class="tag">${esc(val(r, 'market'))}</span>${val(r, 'ind') ? `<span class="tag">${esc(val(r, 'ind'))}</span>` : ''}${badge ? `<span class="badge ${flag}">${badge}</span>` : ''}</div></div>
      <div class="px"><span class="close">${(val(r, 'close') ?? 0).toFixed(2)}</span><span class="chg ${cls}">${arrow} ${Math.abs(chg).toFixed(2)}%</span></div>
      <div class="chips">${chips}</div></a>`;
  }).join('') : '<div class="nores">沒有符合條件的股票，試著放寬條件看看。</div>';
  $('more').hidden = hits.length <= SHOWN;
  $('more').textContent = `顯示更多（還有 ${Math.max(0, hits.length - SHOWN)} 檔）`;
}

function renderAll() { renderPresets(); renderConds(); renderResults(); }

fetch('screen.json', { cache: 'no-cache' }).then(r => r.json()).then(data => {
  data.cols.forEach((c, i) => COLS[c] = i);
  ROWS = data.rows;
  BT = data.bt || {};
  BT_RANGE = data.bt_from ? `${data.bt_from.slice(0, 7).replace('-', '/')} ～ ${data.bt_to.slice(0, 7).replace('-', '/')}` : '';
  F.ind.opts = [...new Set(ROWS.map(r => val(r, 'ind')).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-Hant')).map(x => [x, x]);
  S.conds = S.conds.filter(c => F[c.k]);
  $('meta').textContent = `共 ${ROWS.length} 檔 ・ 資料日期 ${data.date}`;
  $('foot').textContent = `更新時間 ${data.updated}（台北時間）・ 資料來源 Yahoo Finance、證交所、櫃買中心 ・ 僅供學習參考，不構成投資建議`;
  renderAdd(); renderAll();
}).catch(() => { $('meta').textContent = '資料載入失敗，請稍後重新整理'; });

// 自選股清單（記在這支手機上；沒設定過就用預設清單）
try { const v = JSON.parse(localStorage.getItem('watch')); if (Array.isArray(v)) WATCH = v; } catch (e) {}
if (!WATCH.length) fetch('list.json', { cache: 'no-cache' }).then(r => r.json()).then(d => { WATCH = d.watch || []; if (S.onlywatch) renderResults(); }).catch(() => {});
</script>
</body>
</html>
